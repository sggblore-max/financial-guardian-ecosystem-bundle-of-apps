<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FAF9F5">\n<meta name="deployment-version" content="clean-branch-deploy-1">
<title>INZBIZ Advisor Ecosystem Feedback</title>
<style>
:root{--bg:#FAF9F5;--card:#fff;--ink:#2C2C2A;--muted:#5F5E5A;--line:#E8E6DC;--purple:#534AB7;--p50:#EEEDFE;--teal:#0F6E56;--t50:#E1F5EE;--blue:#185FA5;--green:#3B6D11;--g50:#EAF3DE;--amber:#854F0B;--a50:#FAEEDA}
*{box-sizing:border-box}
html,body{margin:0;background:#e9e8e3;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans","Noto Sans Devanagari","Noto Sans Gujarati","Noto Sans Kannada","Noto Sans Telugu","Noto Sans Tamil","Noto Sans Malayalam",Arial,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh}.app{width:100%;max-width:430px;margin:auto;background:var(--bg);min-height:100vh;position:relative}
.page{display:none;min-height:100vh;padding:16px 16px 96px}.page.active{display:block}.cover.active{display:flex;align-items:center;justify-content:center;text-align:center}
.wordmark{width:220px;height:220px;border:4px solid var(--purple);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;background:#fff;color:var(--purple);font-size:34px;font-weight:500;letter-spacing:.04em}
.cover h1{font-size:23px;line-height:1.4;font-weight:500;color:#26215C;margin:0 0 24px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:14px}.mini{width:50px;height:50px;border:2px solid var(--purple);border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;color:var(--purple);font-size:10px;font-weight:600}.lang{margin-left:auto}.lang select{min-height:42px;max-width:140px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:7px 9px;font-size:14px;color:var(--ink)}.pageNo{font-size:12px;color:var(--muted)}
h1{font-size:29px;line-height:1.18;font-weight:500;color:#26215C;margin:0 0 12px}.lead{font-size:18px;line-height:1.5;color:var(--muted);margin:0 0 16px}.kicker{font-size:13px;font-weight:600;color:var(--teal);margin-bottom:7px}
.cards,.feedback,.community{display:grid;gap:10px}.card,.feedbackCard,.communityCard,.rangeCard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}.card b,.feedbackCard h3{display:block;font-size:18px;line-height:1.3;margin:0 0 5px;color:var(--blue);font-weight:500}.card span{font-size:15px;line-height:1.42;color:var(--muted)}
.flow{display:grid;gap:8px}.flowRow{display:grid;grid-template-columns:88px 1fr;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}.flowRow strong{font-size:13px;color:var(--purple)}.flowRow b{font-size:16px;font-weight:500}.flowRow small{display:block;color:var(--muted);font-size:13px;line-height:1.35;margin-top:3px}
.quote{background:var(--p50);border:1px solid #CECBF6;border-radius:12px;padding:14px;font-size:18px;line-height:1.45;color:#26215C;margin:14px 0}.points{display:grid;gap:8px}.point{font-size:16px;line-height:1.45}.usp{background:var(--t50);border:1px solid #9FE1CB;border-radius:12px;padding:16px;font-size:18px;line-height:1.5;color:#04342C}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.chip{background:#fff;border:1px solid #9FE1CB;border-radius:999px;padding:7px 10px;font-size:14px;font-weight:500}
.feedbackIntro{background:var(--a50);border:1px solid #FAC775;border-radius:12px;padding:16px;color:#633806}.feedbackIntro b{display:block;font-size:20px;color:#412402;margin-bottom:7px}.feedbackIntro p{margin:0;font-size:16px;line-height:1.48}
.choiceGrid{display:grid;gap:7px}.choice,.price{min-height:46px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px 12px;font-size:15px;font-weight:600;color:var(--ink);cursor:pointer}.choice.active{background:var(--p50);border-color:#7F77DD}.prices{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px}.price.active{background:var(--g50);border-color:#97C459;color:#173404}
.rangeCard{display:grid;gap:12px;margin-top:12px}.rangeHead{display:flex;align-items:center;justify-content:space-between;gap:10px}.rangeHead b{font-size:15px;line-height:1.3}.rangeHead strong{font-size:25px;color:var(--green)}input[type=range]{width:100%}
.summary{display:grid;gap:8px}.summary .card b{font-size:16px}.summary .card span{font-size:14px}.field{display:grid;gap:6px;margin-top:11px}.field label{font-size:14px;font-weight:600}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;padding:11px;font-size:16px;color:var(--ink)}.field textarea{min-height:76px;resize:vertical}
.communityCard{text-align:center}.badge{width:104px;height:104px;border-radius:50%;border:3px solid var(--purple);display:flex;align-items:center;justify-content:center;margin:0 auto 10px;background:#fff;color:var(--purple);font-size:20px;font-weight:600}.communityCard h3{font-size:19px;font-weight:500;margin:0 0 5px}.communityCard p{font-size:15px;line-height:1.45;color:var(--muted);margin:0 0 12px}
.btn{display:flex;align-items:center;justify-content:center;text-align:center;min-height:50px;border:0;border-radius:8px;padding:12px 14px;font-size:16px;font-weight:600;text-decoration:none;cursor:pointer}.primary{background:var(--purple);color:#fff}.secondary{background:var(--teal);color:#fff}.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(430px,100%);display:flex;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(250,249,245,.98);border-top:1px solid var(--line);z-index:20}.bottom .btn{flex:1}.note{font-size:12px;line-height:1.45;color:var(--muted);margin-top:10px}
@media(max-width:360px){h1{font-size:26px}.lead{font-size:17px}.flowRow{grid-template-columns:78px 1fr}.prices{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body><div class="app">
<section class="page cover active" id="p1"><div><div class="wordmark">INZBIZ</div><h1 id="tag">The next generation field ecosystem for insurance advisors.</h1><button class="btn primary" id="start">Continue →</button><div class="note" id="jsStatus">Loading interactive experience…</div></div></section>
<div id="pages"></div>
</div>
<script src="app.js" defer></script></body></html>
